ábica?", "opts": ["Muros erguidos durante o dia para sombra e fluxo cruzado, lançados à noite com o rebanho dentro como ganho interno", "Está selado permanentemente", "Está enterrado na areia durante o dia", "Está aquecido com fogo o dia todo"], "a": 0}, {"q": "Porque é que uma saliência sul fixa funciona no clima mediterrânico?", "opts": ["O sol está sempre lá em cima", "O sol de verão está alto e o sol de inverno está baixo, por isso as estações são geometricamente separáveis", "Não há sol de verão", "Saliências bloqueiam o vento"], "a": 1}, {"q": "Na quinta do norte da Europa, o que é 'o isolamento'?", "opts": ["Um telhado de palha espesso apenas", "Vidro duplo", "O plano: volumes não aquecidos (celeiro, curral) colocados onde estão as perdas", "Terra protegida por todos os lados"], "a": 2}, {"q": "Qual é o principal problema de conceção no clima marítimo?", "opts": ["Calor extremo", "Carga de neve", "Uma oscilação diária muito ampla", "Humidade — impedir que a água entre no tecido e que o ar circule"], "a": 3}, {"q": "Quando chegou a primeira regulação térmica de Portugal (RCCTE)?", "opts": ["1990, Decreto-Lei n.º 40/90", "Nascido em 1951, com a RGEU", "2006, com a SCE", "2020, com Decreto-Lei n.º 101-D/2020"], "a": 0}, {"q": "Porque é que o design bioclimático foi abandonado entre 1950 e 1973?", "opts": ["Era proibido por lei", "O óleo barato tornou a orientação opcional e o ar condicionado transformou um problema de design num problema de equipamento", "Os arquitetos esqueceram-se da física", "Os climas tornaram-se mais amenos"], "a": 1}, {"q": "Quais as três fontes de calor que adicionam calor dentro de cada edifício?", "opts": ["Vento, chuva e o solo", "Paredes, telhados e pavimentos", "Pessoas, equipamento e o sol", "Iluminação, água e ar"], "a": 2}, {"q": "Quais são os quatro movimentos, repetidos em todos os climas?", "opts": ["Isolamento, vidros, aquecimento e arrefecimento", "Estrutura, revestimento, telhado e fundação", "Cor, textura, forma e escala", e of a few weeks", "Agricultural fertiliser and diesel combustion; lifetime above a century"], "a": 3}, {"q": "How long do fluorinated gases persist in the atmosphere?", "opts": ["1 to 10 years", "1 000 to 10 000 years", "50 to 100 years", "A few days"], "a": 1}, {"q": "How much has atmospheric CO2 been increasing per year recently?", "opts": ["About 0.1 to 0.3 ppm", "About 10 to 15 ppm", "About 2 to 3 ppm", "It has been decreasing"], "a": 2}, {"q": "How far above the 1850–1900 baseline was the 2025 global mean surface temperature (WMO)?", "opts": ["About 0.44 °C", "About 1.44 °C", "About 2.44 °C", "About 3.0 °C"], "a": 1}, {"q": "Where is warming strongest, according to the instrumental record?", "opts": ["Over land and at high latitudes", "Over oceans and in the tropics", "Evenly across the globe", "Only in urban areas"], "a": 0}, {"q": "Why is the loss of glaciers and sea ice described as a reinforcing feedback?", "opts": ["Melted ice releases large amounts of CO2", "Meltwater cools the oceans and stops warming", "Less white surface reflects less energy, which warms the surface further", "Ice loss reduces water vapor in the air"], "a": 2}, {"q": "How much more water vapor does the atmosphere hold per degree of warming?", "opts": ["About 1 %", "About 7 %", "About 20 %", "About 50 %"], "a": 1}, {"q": "When an analysis kept only 200 rural stations, the warming pattern persisted. Which objection does this answer?", "opts": ["That satellites are miscalibrated", "That warming comes from volcanic activity", "That warming is an artifact of urban heat around stations", "That tree-ring data are unreliable"], "a": 2}, {"q": "What is the main test of a climate model's validity?", "opts": ["Whether it predicts the weather on a specific future day", "Whether it reproduces the past when run forward from it, and fails without human forcing", "Whether its results agree with public opinion", "Whether it uses more grid cells than earlier models"], "a": 1}, {"q": "In the IPCC attrib een 2002 and 2014, land water storage reduced sea-level rise by up to 22 %. What is the \"price\" of this rainfall buffer?", "opts": ["Higher ocean salinity everywhere", "Permanent loss of aquifers", "Flash flooding, and drought where storm tracks shift", "Faster glacier growth"], "a": 2}, {"q": "Why does a warmer atmosphere not simply mean \"more rain everywhere\"?", "opts": ["Warm air holds less water vapor", "It brings heavier rain in some regions and deeper drought in others, often in the same year", "Evaporation stops above a certain temperature", "Rainfall only increases over the ocean"], "a": 1}, {"q": "Buildings appear as about 27 % of emissions (IEA, 2022) and 37 % of global CO2 (UNEP and GlobalABC). What explains the difference?", "opts": ["The 37 % figure counts only residential buildings", "The 27 % figure includes aviation", "The 37 % accounting also counts materials, i.e. embodied emissions", "The figures refer to different centuries"], "a": 2}, {"q": "The lecture states that the buildings sector is about \"fifteen times larger\" than which other sector in emissions?", "opts": ["Agriculture", "Aviation", "Shipping", "Heavy industry"], "a": 1}, {"q": "Why does the lecture call renewables on an unimproved envelope \"an expensive way to hide a design failure\"?", "opts": ["Renewables never pay back their cost", "Photovoltaics damage the building envelope", "Envelopes have no effect on energy demand", "Supply should be sized against a demand already minimized by orientation, envelope, mass and shading"], "a": 3}, {"q": "Why must embodied carbon be addressed at the specification stage?", "opts": ["It is fixed at specification and cannot be recovered in operation", "It can be offset later by efficient operation", "It only matters for buildings taller than ten stories", "It is fully regulated by grid decarbonization"], "a": 0}, {"q": "Why are orientation and form described as decisions made in the first week of a project?", "opts": ["They are expensive and can be changed cheaply later", "They matter only for buildings in hot climates", "They are free, permanent and impossible to retrofit", "They are decided by the planning authority"], "a": 2}, {"q": "Within the architect's sphere of action, how is grid decarbonization classified?", "opts": ["Something the architect decides", "Something the architect influences, through on-site generation and demand reduction", "Something entirely outside the architect's influence", "Something decided by building users only"], "a": 1}, {"q": "Which climate effect does the lecture describe as the one that architects' drawings change directly?", "opts": ["Ocean acidification", "Global sea-level rise", "Arctic sea-ice loss", "The urban heat island"], "a": 3}, {"q": "In the lecture's framing, what does installing air conditioning to deal with overheating reveal?", "opts": ["That passive cooling through shading and ventilation was not achieved in the design", "That the climate is too extreme for any building", "That the building complies with NZEB requirements", "That renewables have been correctly sized"], "a": 0}, {"q": "Which argument did Victor Olgyay (1963) put forward?", "opts": ["Technology will make climate irrelevant to design", "Buildings should be sealed from the outdoor climate", "Climate generates form", "Demolition is preferable to refurbishment"], "a": 2}, {"q": "For a coastal site in Lisboa, which factors determine local sea-level exposure besides the global rise?", "opts": ["Wind speed and solar radiation", "Elevation, subsidence, tidal range and storm surge", "Air temperature and humidity only", "Distance from the nearest airport"], "a": 1}, {"q": "Why does the lecture reject terraforming Mars as a response to climate change?", "opts": ["It demands an energy budget far beyond anything available, so it avoids a plan rather than being one", "Mars has a climate too similar to Earth's", "International treaties forbid it", "Mars has no water at all"], "a": 0}, {"q": "What shape function tryCode(){
  const inp=$("#c-code"); if(!inp||inp.disabled) return;
  const now=Date.now(), info=lockInfo();
  if(now<info.u){ refreshLockMsg(); return; }
  if(inp.value===SETTINGS_CODE){ lockSave({f:0,u:0}); UNLOCKED=true; renderQuiz(); return; }
  info.f=(info.f||0)+1;
  if(info.f===3) info.u=now+5*60*1000;
  else if(info.f===4) info.u=now+10*60*1000;

function refreshLockMsg(){
  const m=$("#c-lockmsg"); if(!m) return;
  if(window._lockT){ clearInterval(window._lockT); window._lockT=null; }
  const info=lockInfo(), rem=info.u-Date.now();
  const inp=$("#c-code");
  if(rem>0){
    if(inp) inp.disabled=true;
    const tick=()=>{
      const r=lockInfo().u-Date.now(), mm=$("#c-lockmsg"), ii=$("#c-code");
      if(r<=0){
        if(window._lockT){clearInterval(window._lockT);window._lockT=null;}
        if(ii) ii.disabled=false;
        if(mm) mm.textContent=`${t("wrongCode")} (0 ${t("triesLeft")})`;

        mm.textContent=`${t("lockedMsg")} ${Math.floor(r/60000)}:${String(Math.floor(r%60000/1000)).padStart(2,"0")} ${t("minShort")}`;
      }
    };
    tick();
    window._lockT=setInterval(tick,1000);
  }else{
    if(inp) inp.disabled=false;
    const left=Math.max(0,3-(info.f||0));
    m.textContent=(info.f||0)>0?`${t("wrongCode")} (${left} ${t("triesLeft")})`:"";
  }
}

function rnd(n){ // crypto-backed int in [0,n)
  const b = new Uint32Array(1);
  crypto.getRandomValues(b);
  return b[0] % n;
}
function shuffle(a){
  for(let i=a.length-1;i>0;i--){ const j=rnd(i+1); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function sampleIdx(n,k){ return shuffle([...Array(n).keys()]).slice(0,k); }

const fileB64 = f => new Promise((ok,no)=>{ const r=new FileReader(); r.onload=()=>ok(String(r.result).split(",")[1]||""); r.onerror=()=>no(r.error); r.readAsDataURL(f); });
async function labSend(k){
  const msg=$("#l-m"+k), btn=$("#l-s"+k), p=labParse($("#l-grp").value);
  const nm=$("#l-name").value.trim().replace(/\s+/g," ");
  const f=$("#l-f"+k).files[0], link=$("#l-l"+k).value.trim();
  if(!fullName(nm)){ msg.textContent=t("needFull"); $("#l-name").focus(); return; }
  if(!p){ msg.textContent=t("labPick"); return; }
  if(!f && !link){ msg.textContent=t("labNeedFile"); return; }
  if(f && !(f.type==="application/pdf" || /\.pdf$/i.test(f.name))){ msg.textContent=t("labNotPdf"); return; }
  if(f && f.size>LAB_MAX){ msg.textContent=t("labTooBig"); return; }
  if(!f && !safeLink(link)){ msg.textContent=t("labBadLink"); return; }
  const url=submitURL(); if(!url){ msg.textContent=t("trNeedURL"); return; }
  btn.disabled=true; msg.textContent=t("labSending");
  try{
    const q=new URLSearchParams({action:"labsubmit", track:p.track, g:p.g, k:String(k), name:nm});
    let body="";
    if(f){ q.set("file", f.name); body=await fileB64(f); } else { q.set("kind","link"); q.set("link",link); }
    const r=await fetch(url+(url.includes("?")?"&":"?")+q, {method:"POST", headers:{"Content-Type":"text/plain;charset=UTF-8"}, body});
    const j=await r.json().catch(()=>({}));
    if(r.ok && j.ok){
      try{ localStorage.setItem("qm_name",nm); }catch(e){}
      await loadLabStatus(); const m=$("#l-m"+k); if(m) m.textContent=t("labSent"); return;
    }
    if(j.error==="closed"){ await loadLabStatus(); ($("#l-m"+k)||$("#l-msg")).textContent=t("labIsClosed"); return; } // closed meanwhile: show the fresh state
    msg.textContent = (r.status===413 || j.error==="too large") ? t("labTooBig")
      : j.error==="not pdf" ? t("labNotPdf") : j.error==="link" ? t("labBadLink") : (r.status===403 || j.error==="bad json") ? t("labOld")
      : `${t("clsFail")} (${r.status}${j.error?" "+j.error:""}${j.detail?": "+j.detail:""})`;
  }catch(e){ msg.textContent=await workerDiag(url); }
  btn.disabled=false;
}
function startQuiz(){
  const nm=$("#c-name").value.trim(), kg=$("#c-klass").value;

  }
  const lesson = LESSON_SEL;

  const n = Math.max(1, Math.min(bank.length, parseInt($("#c-n").value||"10",10)));
  const shQ = $("#c-sq").checked, shO = $("#c-so").checked;
  const idx = shQ ? sampleIdx(bank.length, n) : [...Array(bank.length).keys()].slice(0,n);
  const items = idx.map(bi => {
    const s = bank[bi];
    const order = shO ? shuffle([0,1,2,3]) : [0,1,2,3];
    return { q:s.q, opts:order.map(o=>s.opts[o]), correct:order.indexOf(s.a), src:bi };
  });
  const mins = parseInt($("#c-min").value||"0",10);
  Q = { lesson, n, items, ans:{}, i:0, done:false,

        startT:Date.now(), left:mins>0?mins*60:null, timerId:null, bankSize:bank.length };
  if(Q.left!==null){

// Class code sent with a result: a ?code= link wins, otherwise the lecture itself (aula2 -> "Lecture02"),

function classCode(lesson){ return DEF.code || "Lecture"+String(lesson).replace(/\D/g,"").padStart(2,"0"); }
async function postAttempt(A){ // "" when stored, otherwise the reason to show
  const url=submitURL();
  try{
    const r=await toWorker(url, resultPayload(classCode(A.lesson), A));
    if(r.ok){ try{localStorage.setItem("qa_sent_"+A.id,"1");}catch(e){} return ""; }
    if(r.status===403) return `${t("codeRejected")} ${classCode(A.lesson)}`;
    const j=await r.json().catch(()=>({}));
    return `${t("srvFail")} (${r.status}${j.error?" "+j.error:""}${j.detail?": "+j.detail:""})`;
  }catch(e){ return await workerDiag(url); }

function autoSend(A, redraw){ // A.send: "sending" | "fail" (A.sendMsg = reason); A.sent once stored
  if(!submitURL() || A.sent || A.send==="sending") return;
  A.send="sending"; A.sendMsg=""; redraw();
  postAttempt(A).then(m=>{ A.send=m?"fail":"done"; A.sendMsg=m; if(!m) A.sent=true; redraw(); });
}

    : A.send==="fail" ? `<button class="btn solid" id="${retryId}">${esc(t("sendAgain"))}</button><span class="hint">${esc(A.sendMsg)}</span>`

// The POST got no readable answer: ask the Worker with a plain GET to tell "offline / wrong code deployed"
// from "quiz Worker deployed but it crashed" (our worker.js answers GET with {"error":"POST only"} + CORS).
async function workerDiag(url){
  try{
    const r=await fetch(url); const j=await r.json();
    if(j && j.error==="POST only") return t("wkCrash");
  }catch(e){}
  return `${t("wkDown")} ${url}`;
}

/* ---------- Portuguese translation with Gemma (teacher, through the Worker) ---------- */
// The Worker (worker.js, action "translate") holds the model; the page never sees a key.
// Output: bank-pt.json in the repo root, loaded at start-up as the PT bank (answer key from EN).
// Worker teacher code: remembered on this device once it has worked (the teacher's own computer), until Forget.
function tcodeLoad(){ try{ return localStorage.getItem("qm_tcode")||""; }catch(e){ return ""; } }
function tcodeKeep(ok){ try{ if(ok) localStorage.setItem("qm_tcode",TRCODE); else localStorage.removeItem("qm_tcode"); }catch(e){} }
let TRS = {}, TRCODE = tcodeLoad(), PTX = {}, TRMODEL = "";
function ptItemOK(it,src){ return it && typeof it.q==="string" && it.q.trim() && Array.isArray(it.opts) && it.opts.length===4 &&
  it.opts.every(o=>typeof o==="string" && o.trim()) && it.a===src.a; }
function trSay(s){ const m=$("#b-trmsg"); if(m) m.textContent=s; }
function trCell(s,i,ed){
  const at=f=>ed?` contenteditable="true" spellcheck="true" data-i="${i}" data-f="${f}"`:"";
  return `<div class="trq"${at("q")}>${esc(s.q)}</div>`+s.opts.map((o,k)=>
    `<div class="tro${k===s.a?" ok":""}"><span class="L">${LETTERS[k]}</span><span${at(k)}>${esc(o)}</span></div>`).join("");
}
function drawTR(bk){
  const out=$("#b-trout"); if(!out) return;
  if(!TRS[bk] && PTX[bk]) TRS[bk]={lesson:bk, items:PTX[bk].map(it=>({q:it.q,opts:it.opts.slice(),a:it.a})), n:PTX[bk].length, done:true, loaded:true};
  const job=TRS[bk], src=BANKS.en[bk];
  $("#b-trdl").disabled=!Object.values(TRS).some(j=>j.done) && !Object.keys(PTX).length;
  $("#b-tr").disabled=!!(job&&job.busy);
  if(!job){ out.innerHTML=""; trSay(""); return; }
  trSay(job.busy?`${t("trBusy")} ${job.items.length}/${job.n}`:job.err?job.err:job.loaded?t("trLoaded"):job.done?t("trDone"):"");
  out.innerHTML=!job.items.length?"":`<div class="tbl-scroll" style="margin-top:12px"><table class="data trtab">
    <thead><tr><th class="num">${esc(t("thN"))}</th><th>English</th><th>Português</th></tr></thead>
    <tbody>${job.items.map((it,i)=>`<tr><td class="num">${i+1}</td><td>${trCell(src[i],i,false)}</td><td>${trCell(it,i,job.done)}</td></tr>`).join("")}</tbody>
  </table></div>`;
}
async function runTranslate(bk){
  const url=submitURL();
  if(!url){ trSay(t("trNeedURL")); return; }
  if(!TRCODE){ trSay(t("trNeedCode")); $("#b-tcode").focus(); return; }
  const src=BANKS.en[bk];
  let job=TRS[bk];
  if(job && job.done && !confirm(t("trRedo"))) return;
  if(!job || job.done) job=TRS[bk]={lesson:bk, items:[], n:src.length, done:false}; // otherwise resume where it stopped
  job.busy=true; job.err="";
  const redraw=()=>{ if(TAB==="bank" && $("#b-lesson") && $("#b-lesson").value===bk) drawTR(bk); };
  redraw();
  while(job.items.length<src.length){
    const from=job.items.length, batch=src.slice(from, from+10);
    let res=null, err=t("trFail");
    for(let tries=0; tries<2 && !res; tries++){
      try{
        const r=await toWorker(url,{action:"translate", code:TRCODE, items:batch.map(s=>({q:s.q,opts:s.opts}))});
        const j=await r.json().catch(()=>({}));
        if(r.status===403){ err=t("trBadCode"); tcodeKeep(false); break; }
        if(r.ok && j.ok && Array.isArray(j.items) && j.items.length===batch.length){ res=j.items; TRMODEL=j.model||TRMODEL; tcodeKeep(true); }
        else if(j.error) err=`${t("trFail")} (${j.error})`;
      }catch(e){ err=t("netFail"); }
    }
    if(!res){ job.busy=false; job.err=err; redraw(); return; }
    res.forEach((it,k)=>job.items.push({q:it.q, opts:it.opts.slice(0,4), a:batch[k].a}));
    redraw();
  }
  job.busy=false; job.done=true; redraw();
}
function trDownload(){
  const banks={};
  Object.keys(BANKS.en).forEach(k=>{
    const job=TRS[k];
    if(job && job.done) banks[k]=job.items.map(it=>({q:it.q, opts:it.opts.slice(), a:it.a}));
    else if(PTX[k]) banks[k]=PTX[k];
  });
  if(Object.entries(banks).some(([k,L])=>!L.every((it,i)=>ptItemOK(it,BANKS.en[k][i])))){ trSay(t("trEmpty")); return; }
  const body=JSON.stringify({format:"quiz-machine-bank-pt", version:1, model:TRMODEL||"@cf/google/gemma-4-26b-a4b-it",
    updated:new Date().toISOString(), banks}, null, 1);
  const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([body],{type:"application/json"})); a.download="bank-pt.json";
  document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},500);
  trSay(t("trSaved"));
}
function loadPT(){ // bank-pt.json next to index.html (GitHub Pages); silently absent offline or before first upload
  fetch("bank-pt.json",{cache:"no-cache"}).then(r=>r.ok?r.json():null).then(j=>{
    if(!j || !j.banks) return;
    Object.keys(BANKS.en).forEach(k=>{
      const L=j.banks[k], src=BANKS.en[k];
      if(Array.isArray(L) && L.length===src.length && L.every((it,i)=>ptItemOK(it,src[i]))){ BANKS.pt[k]=L; PTX[k]=L; }
    });
    if(TAB==="bank") renderPage();
  }).catch(()=>{});
}

function csvEsc(v){
  v=v==null?"":String(v);
  if(/^[=+\-@\t\r]/.test(v)) v="'"+v; // student-typed names must not run as spreadsheet formulas
  return /[;"\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;
}
function fmtLocal(s){ // stored dates are UTC ("…T15:54:02.744Z" or local rows "2026-10-09 15:54") → local "YYYY-MM-DD HH:MM"
  s=String(s||"");
  const d=new Date(/(Z|[+-]\d\d:?\d\d)$/.test(s) ? s : s.replace(" ","T")+(s.length<=16?":00Z":"Z"));
  if(isNaN(d)) return s;
  const p=n=>String(n).padStart(2,"0");
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function downloadCSV(rows, fname, withClass){
  const head=["date","name","group",...(withClass?["class"]:[]),"bank","attempt","n","score","pct","points","secs","detail"];
  const lines=[head.join(";")].concat(rows.map(r=>[fmtLocal(r.date),r.name,r.klass,...(withClass?[r.cls]:[]),r.lesson,r.id,r.n,r.score,r.pct,fmtPts(pts(r.score,r.n)).replace(".",","),r.secs,r.detail].map(csvEsc).join(";")));
  const blob=new Blob(["\ufeff"+lines.join("\n")],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=fname;
  document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},500);
}

    (all.length?`<div class="panel"><div class="panel-head"><div class="panel-title"><h3>${esc(t("thisDev"))}</h3></div></div><div class="tbl-scroll"><table class="data">
      <thead><tr><th>${esc(t("thDate"))}</th><th>${esc(t("klass"))}</th><th>${esc(t("thAtt"))}</th><th class="num">${esc(t("thScore"))}</th><th class="num">${esc(t("thPts"))}</th><th class="num">${esc(t("thT"))}</th></tr></thead>
      <tbody>${all.map(r=>`<tr><td style="font-family:var(--mono)">${esc(fmtLocal(r.date))}</td><td>${esc(grpLabel(r.klass)||"—")}<br><span class="meta">${esc(r.lesson)}</span></td><td style="font-family:var(--mono)">${esc(r.id)}</td><td class="num">${r.score}/${r.n} · ${r.pct}%</td><td class="num"><b>${fmtPts(pts(r.score,r.n))}</b></td><td class="num">${fmtTime(r.secs)}</td></tr>`).join("")}</tbody>
    </table></div></div>`:`<p class="hint">${esc(t("empty"))}</p>`);
  $("#e-url").value=submitURL();
  if(!UNLOCKED){ $("#e-url").disabled=true; $("#e-save").disabled=true; }
  $("#e-save").onclick=()=>{ try{localStorage.setItem("qa_submit",$("#e-url").value.trim());}catch(e){} $("#e-msg").textContent=t("submitSaved"); };
  if(!UNLOCKED){
    const go=()=>{ const m=codeCheck($("#e-code").value); if(m){ $("#e-code").value=""; $("#e-lockmsg").textContent=m; } else renderRes(); };
    $("#e-codeok").onclick=go;
    $("#e-code").onkeydown=e=>{ if(e.key==="Enter") go(); };
    return;
  }
  $("#e-lock").onclick=()=>{ UNLOCKED=false; renderRes(); };
  $("#e-tcode").value=TRCODE;
  $("#e-tcode").oninput=e=>{ TRCODE=e.target.value; };
  $("#e-tcode").onkeydown=e=>{ if(e.key==="Enter") showClass(true); };
  $("#e-tcode").onchange=()=>showClass(); // leaving the field after typing loads the list too
  $("#e-cls").onclick=classCSV;
  if($("#e-tforget")) $("#e-tforget").onclick=()=>{ tcodeKeep(false); TRCODE=""; CLS=null; CLS_TRIED=""; renderRes(); $("#e-clsmsg").textContent=t("tcForgot"); };
  drawClass();
  // remembered code: the list loads by itself once per page load, right after 3016
  if(!CLS && TRCODE && tcodeLoad()===TRCODE && !window._clsAuto){ window._clsAuto=true; showClass(); }
  if(all.length){
    $("#e-all").onclick=()=>downloadCSV(loadRes(),"quiz-results.csv");
    $("#e-clear").onclick=()=>{localStorage.removeItem(LSKEY); renderRes();};
  }
}
function codeCheck(val){ // teacher code with the shared escalating lockout; "" = unlocked, otherwise the message to show
  const now=Date.now(), info=lockInfo();
  const wait=r=>`${t("lockedMsg")} ${Math.floor(r/60000)}:${String(Math.floor(r%60000/1000)).padStart(2,"0")} ${t("minShort")}`;
  if(now<info.u) return wait(info.u-now);
  if(val===SETTINGS_CODE){ lockSave({f:0,u:0}); UNLOCKED=true; return ""; }
  info.f=(info.f||0)+1;
  if(info.f===3) info.u=now+5*60*1000;
  else if(info.f===4) info.u=now+10*60*1000;
  else if(info.f>=5) info.u=now+60*60*1000;
  lockSave(info);
  const ru=info.u-Date.now();
  return ru>0 ? wait(ru) : `${t("wrongCode")} (${Math.max(0,3-info.f)} ${t("triesLeft")})`;
}
/* ---------- class results: every attempt sent to the Worker (private quiz-results repo) ---------- */
let CLS = null; // {records, filter}: last list loaded in this tab (kept across re-renders, never stored)
async function fetchClass(){ // records, or null with the reason shown
  const url=submitURL(), msg=$("#e-clsmsg");
  if(!url){ msg.textContent=t("trNeedURL"); return null; }
  if(!TRCODE){ msg.textContent=t("trNeedCode"); $("#e-tcode").focus(); return null; }
  msg.textContent=t("clsBusy");
  try{
    const r=await toWorker(url,{action:"results",code:TRCODE});
    const j=await r.json().catch(()=>({}));
    if(r.status===403){ tcodeKeep(false); msg.textContent=await badCodeWhy(url,j); return null; }
    if(j.error==="setup"){ msg.textContent=t("clsSetup"); return null; }
    if(!r.ok || !j.ok || !Array.isArray(j.records)){ msg.textContent=`${t("clsFail")} (${r.status}${j.error?" "+j.error:""}${j.detail?": "+j.detail:""})`; return null; }
    const isNew=tcodeLoad()!==TRCODE; tcodeKeep(true);
    msg.textContent=(j.records.length?`${j.records.length} ${t(j.records.length===1?"clsCount1":"clsCount")}`:t("clsNone"))+(j.truncated?` ${t("clsTrunc")}`:"")+(isNew?` · ${t("tcKept")}`:"");
    CLS={records:j.records, filter:CLS?CLS.filter:"", roster:("roster" in j)?j.roster:undefined, rosterError:j.rosterError||"", lab:("lab" in j)?(j.lab||{open:[],subs:{}}):undefined};
    return j.records;
  }catch(e){ msg.textContent=await workerDiag(url); return null; }
}
async function badCodeWhy(url,j){ // 403 to {action:"results"}: which of the three causes
  if(j.detail==="TEACHER_CODE not set") return t("tcMissing");
  // A Worker without the results action treats the request as a student attempt: with a class code it then
  // answers 400 "shape" (nothing is saved), where a current Worker answers 403 again.
  try{
    const r=await toWorker(url,{action:"results",code:classCode(LESSON_SEL||"aula0")});
    const k=await r.json().catch(()=>({}));
    if(r.status===400 && k.error==="shape") return t("tcOldWorker");
  }catch(e){}
  return t("trBadCode");
}
let CLS_BUSY = false, CLS_TRIED = ""; // one request at a time; the same code is not re-sent on Enter + leaving the field
async function showClass(force){ // force (Enter): reload even if this code already loaded the list
  if(CLS_BUSY) return;
  if(!TRCODE){ if(force) $("#e-clsmsg").textContent=t("trNeedCode"); return; }
  if(!force && TRCODE===CLS_TRIED) return;
  CLS_BUSY=true; CLS_TRIED=TRCODE;
  const ok=await fetchClass(); drawClass();
  if(!ok) CLS_TRIED=""; // a rejected or failed code can be retried after correcting it
  CLS_BUSY=false;
}
async function classCSV(){ // always a fresh list; also refreshes the table on screen
  const btn=$("#e-cls"); btn.disabled=true;
  const recs=await fetchClass(); drawClass();
  if(recs && recs.length){
    const rows=recs.slice().sort((a,b)=>String(a.date).localeCompare(String(b.date))).map(x=>({date:x.date, name:x.name, klass:x.group, cls:x.class,
      lesson:x.bank, id:x.id, n:x.n, score:x.score, pct:x.pct, secs:x.secs, detail:x.detail}));
    downloadCSV(rows, "quiz-class-results-"+new Date().toISOString().slice(0,10)+".csv", true);
    $("#e-clsmsg").textContent=`${rows.length} ${t("clsDone")}`;
  }
  if($("#e-cls")) $("#e-cls").disabled=false;
}
let ROSTER_OPEN = false;
function drawRoster(){ // lab groups with names: shown only once the Worker accepted the teacher code
  const out=$("#e-roster"); if(!out) return;
  if(!CLS){ out.innerHTML=""; return; }
  if(CLS.roster===undefined){ out.innerHTML=`<p class="hint" style="margin:10px 0 0">${esc(t("rosterOld"))}</p>`; return; }
  if(!CLS.roster){ out.innerHTML=`<p class="hint" style="margin:10px 0 0">${esc(t(CLS.rosterError?"rosterBad":"rosterNone"))}</p>`; return; }
  const R=CLS.roster, house=(tr,L)=>((LAB_GROUPS[tr]||[]).find(g=>g[0]===L)||[])[1]||"";
  let total=0;
  const col=tr=>{
    const groups=Object.keys(R[tr]||{}).sort();
    return `<div><h4>${esc(t(tr==="architects"?"grpArch":"grpEng"))}</h4>${groups.map(L=>{ const names=R[tr][L]||[]; total+=names.length;
      return `<div><b>${esc(labName(L,house(tr,L)))}</b><ul>${names.map(n=>`<li>${esc(n)}</li>`).join("")}</ul></div>`; }).join("")}</div>`;
  };
  const cols=col("architects")+col("engineers");
  out.innerHTML=`<details class="roster" style="margin:12px 0 0"${ROSTER_OPEN?" open":""}><summary>${esc(t("rosterH"))} · ${total} ${esc(t("rosterStud"))}</summary>
    <p class="hint" style="margin:4px 0 0">${esc(t("rosterP"))}</p><div class="grid g2">${cols}</div></details>`;
  out.querySelector("details").ontoggle=e=>{ ROSTER_OPEN=e.target.open; };
}
let LAB_ADM_OPEN = null; // remembered open/closed state of the panel (default: open in LAB mode)
function drawLabAdmin(){
  const out=$("#e-lab"); if(!out) return;
  if(!CLS){ out.innerHTML=""; return; }
  if(CLS.lab===undefined){ out.innerHTML=`<p class="hint" style="margin:10px 0 0">${esc(t("labAdmOld"))}</p>`; return; }
  const L=CLS.lab, rows=[];
  ["architects","engineers"].forEach(tr=>LAB_GROUPS[tr].forEach(([g,h])=>rows.push({tr,g,h})));
  const ks=[...Array(LAB_N).keys()].map(i=>i+1), sub=(r,k)=>L.subs[`${r.tr}-${r.g}-s${k}`];
  const isOpen=LAB_ADM_OPEN===null ? KIND==="lab" : LAB_ADM_OPEN;
  out.innerHTML=`<details class="roster" style="margin:12px 0 0"${isOpen?" open":""}><summary>${esc(t("labAdmH"))} · ${esc(t("labOpenList"))}: ${L.open.length?L.open.join(", "):esc(t("labNone"))}</summary>
    <p class="hint" style="margin:4px 0 8px">${esc(t("labAdmP"))}</p>
    <div class="tbl-scroll"><table class="data labmx"><thead><tr><th>${esc(t("labGrp"))}</th>${ks.map(k=>{ const o=L.open.includes(k);
      return `<th class="num">${esc(t("labSub"))} ${k}<br><button class="btn${o?" solid":""}" data-lk="${k}" data-lo="${o?0:1}">${esc(t(o?"labCloseB":"labOpenB"))}</button><br><span class="meta">${rows.filter(r=>sub(r,k)).length}/${rows.length}</span></th>`; }).join("")}</tr></thead>
    <tbody>${rows.map(r=>`<tr><td>${esc(t(r.tr==="architects"?"grpArch":"grpEng"))} · ${esc(labName(r.g,r.h))}</td>${ks.map(k=>{ const x=sub(r,k);
      if(!x) return `<td class="num">—</td>`;
      const what = x.kind==="pdf" ? `<a href="#" data-dl="${r.tr}|${r.g}|${k}">PDF</a>` : safeLink(x.link) ? `<a href="${esc(x.link)}" target="_blank" rel="noopener">${esc(t("labLinkW"))}</a>` : "";
      return `<td class="num" title="${esc(x.name||"")}">✓ ${esc(fmtLocal(x.date))}<br>${what}</td>`; }).join("")}</tr>`).join("")}</tbody></table></div></details>`;
  out.querySelector("details").ontoggle=e=>{ LAB_ADM_OPEN=e.target.open; };
  out.querySelectorAll("[data-lk]").forEach(b=>b.onclick=()=>labToggle(+b.dataset.lk, b.dataset.lo==="1", b));
  out.querySelectorAll("[data-dl]").forEach(a=>a.onclick=e=>{ e.preventDefault(); const [tr,g,k]=a.dataset.dl.split("|"); labDownload(tr,g,+k,a); });
}
async function labToggle(k, open, btn){
  const url=submitURL(), msg=$("#e-clsmsg"); btn.disabled=true;
  try{
    const r=await toWorker(url,{action:"labopen", code:TRCODE, k, open});
    const j=await r.json().catch(()=>({}));
    if(r.ok && j.ok){ CLS.lab=j.lab; drawLabAdmin(); return; }
    msg.textContent = r.status===403 ? await badCodeWhy(url,j) : `${t("clsFail")} (${r.status}${j.error?" "+j.error:""}${j.detail?": "+j.detail:""})`;
  }catch(e){ msg.textContent=await workerDiag(url); }
  btn.disabled=false;
}
async function labDownload(tr, g, k, a){
  const url=submitURL(), msg=$("#e-clsmsg"); a.textContent=t("clsBusy");
  try{
    const r=await toWorker(url,{action:"labfile", code:TRCODE, track:tr, g, k});
    if(r.ok){
      const blob=await r.blob(), x=document.createElement("a");
      x.href=URL.createObjectURL(blob); x.download=`${TRACK_EN[tr]}-Group${g}-Submission${k}.pdf`;
      document.body.appendChild(x); x.click(); setTimeout(()=>{ URL.revokeObjectURL(x.href); x.remove(); },500);
    } else { const j=await r.json().catch(()=>({})); msg.textContent=`${t("clsFail")} (${r.status}${j.error?" "+j.error:""})`; }
  }catch(e){ msg.textContent=await workerDiag(url); }
  a.textContent="PDF";
}
function drawClass(){
  drawLabAdmin();
  drawRoster(); // list on screen without student names (names only in the CSV): find a score by attempt code
  const out=$("#e-clsout"); if(!out) return;
  if(!CLS || !CLS.records.length){ out.innerHTML=""; return; }
  const classes=[...new Set(CLS.records.map(r=>r.class).filter(Boolean))].sort();
  if(CLS.filter && !classes.includes(CLS.filter)) CLS.filter="";
  const rows=CLS.records.filter(r=>!CLS.filter || r.class===CLS.filter).slice()
    .sort((a,b)=>String(b.date).localeCompare(String(a.date))); // newest first
  const avg=rows.length ? rows.reduce((s,r)=>s+(+r.pct||0),0)/rows.length : 0;
  const avgPts=rows.length ? rows.reduce((s,r)=>s+pts(r.score,r.n),0)/rows.length : 0;
  const by=key=>{ // [[label, attempts, average %, average points]] sorted by label
    const m=new Map(); rows.forEach(r=>{ const k=key(r); const v=m.get(k)||[0,0,0]; v[0]++; v[1]+=(+r.pct||0); v[2]+=pts(r.score,r.n); m.set(k,v); });
    return [...m.entries()].sort((a,b)=>a[0].localeCompare(b[0])).map(([k,[n,sum,sp]])=>[k,n,sum/n,sp/n]);
  };
  const sumTable=(title,list)=>`<div class="tbl-scroll"><table class="data">
      <thead><tr><th>${esc(title)}</th><th class="num">${esc(t("thAttempts"))}</th><th class="num">${esc(t("thAvg"))}</th><th class="num">${esc(t("thPts"))}</th></tr></thead>
      <tbody>${list.map(([k,n,a,ap])=>`<tr><td>${esc(k)}</td><td class="num">${n}</td><td class="num">${a.toFixed(0)}%</td><td class="num"><b>${fmtPts(ap)}</b></td></tr>`).join("")}</tbody></table></div>`;
  const lectures=by(r=>String(r.bank||"").split(" — ")[0]||"—"), groups=by(r=>grpLabel(r.group)||"—");
  out.innerHTML=`<div class="controls" style="margin:12px 0 10px">
      <span class="ctl"><label>${esc(t("code"))}</label><select id="e-clsf"><option value="">${esc(t("clsAll"))}</option>${
        classes.map(c=>`<option value="${esc(c)}"${c===CLS.filter?" selected":""}>${esc(c)}</option>`).join("")}</select></span>
      <span class="meta">${rows.length} ${esc(t(rows.length===1?"clsCount1":"clsCount"))} · ${esc(t("clsAvg"))} ${avg.toFixed(0)}% · ${fmtPts(avgPts)}/${PTS_MAX} ${esc(t("ptsUnit"))}</span>
    </div>
    <div class="grid g2" style="margin:0 0 14px">${sumTable(t("avgLecture"),lectures)}${sumTable(t("avgGroup"),groups)}</div>
    <div class="tbl-scroll"><table class="data">
      <thead><tr><th>${esc(t("thDate"))}</th><th>${esc(t("code"))}</th><th>${esc(t("klass"))}</th><th>${esc(t("thAtt"))}</th><th class="num">${esc(t("thScore"))}</th><th class="num">${esc(t("thPts"))}</th><th class="num">${esc(t("thT"))}</th></tr></thead>
      <tbody>${rows.map(r=>`<tr><td style="font-family:var(--mono)">${esc(fmtLocal(r.date))}</td><td>${esc(r.class||"—")}</td><td>${esc(grpLabel(r.group)||"—")}<br><span class="meta">${esc(r.bank)}</span></td><td style="font-family:var(--mono)">${esc(r.id)}</td><td class="num">${esc(r.score)}/${esc(r.n)} · ${esc(r.pct)}%</td><td class="num"><b>${fmtPts(pts(r.score,r.n))}</b></td><td class="num">${fmtTime(+r.secs||0)}</td></tr>`).join("")}</tbody>
    </table></div>`;
  $("#e-clsf").onchange=e=>{ CLS.filter=e.target.value; drawClass(); };
}

/* ---------- language ---------- */
function setLang(l){
  LANG=l;
  document.documentElement.lang=l;
  document.querySelectorAll(".langsel button").forEach(b=>b.setAttribute("aria-pressed", String(b.dataset.lang===l)));
  document.querySelectorAll("[data-t]").forEach(n=>{ const k=n.getAttribute("data-t"); if(STR[l][k]!==undefined) n.textContent=STR[l][k]; });
  P._lang=l; drawKind(); renderTabs(); renderPage();
}
document.querySelectorAll(".langsel button").forEach(b=>b.onclick=()=>setLang(b.dataset.lang));
document.querySelectorAll(".kindsel button").forEach(b=>b.onclick=()=>setKind(b.dataset.kind));
const ONLY_LANG = "en"; // 2026/27: English only, PT/EN switch hidden; set to "" to bring the switch back
if(ONLY_LANG) $(".langsel").style.display="none";

/* ---------- init ---------- */
projReshuffle();
setLang(ONLY_LANG||"en");
loadPT();
